name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          manifests = [Path('package.json'), *Path('packages').glob('*/package.json'), *Path('apps').glob('*/package.json')]
          for manifest in manifests:
              assert json.loads(manifest.read_text())['version'] == version, str(manifest)
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split('## ' + version + ' — ', 1)[1].split('\n', 1)[1].split('\n## ', 1)[0]
          curated = Path('docs/releases') / (os.environ['RELEASE_TAG'] + '.md')
          title = os.environ['RELEASE_TAG']
          body = section.strip()
          if curated.exists():
              heading, body = curated.read_text().split('\n', 1)
              assert heading.startswith('# ' + title + ' — '), 'Release note title must match tag'
              title = heading.removeprefix('# ')
          Path('release-notes.md').write_text(body.strip() + '\n')
          Path('release-title.txt').write_text(title)
          PY
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$(cat release-title.txt)" --notes-file release-notes.md "${flags[@]}"
