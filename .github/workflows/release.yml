name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          manifests = [Path('package.json'), *Path('packages').glob('*/package.json'), *Path('apps').glob('*/package.json')]
          for manifest in manifests:
              assert json.loads(manifest.read_text())['version'] == version, str(manifest)
          changelog = Path('CHANGELOG.md').read_text()
          section = changelog.split('## ' + version + ' — ', 1)[1].split('\n', 1)[1].split('\n## ', 1)[0]
          Path('release-notes.md').write_text(section.strip() + '\n')
          PY
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
