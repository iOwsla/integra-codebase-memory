name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: codememory
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: codememory
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U codememory"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun dist/index.js --help
      - run: bun run verify:parser tests/fixtures/typescript/regression-005-call-owners
      - run: bun run profile:parser tests/fixtures/typescript/regression-005-call-owners 1
      - run: bun run simulate:project 10
      - run: bun scripts/verify-services.ts
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx vitest run tests/unit/prisma.test.ts
      - run: bun scripts/verify-upgrade.ts
      - name: Verify Windows PowerShell 5.1 installation
        shell: powershell
        env:
          TEST_PUBLISHED_BOOTSTRAP: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./tests/windows-path.ps1
          ./tests/windows-installer.ps1
      - name: Verify PowerShell 7 installation
        shell: pwsh
        env:
          TEST_PUBLISHED_BOOTSTRAP: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./tests/windows-path.ps1
          ./tests/windows-installer.ps1
  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: sh -n scripts/setup/ensure-docker.sh
      - run: bunx vitest run tests/unit/services.test.ts tests/e2e/installer.test.ts tests/e2e/bootstrap.test.ts tests/e2e/update.test.ts tests/unit/prisma.test.ts
