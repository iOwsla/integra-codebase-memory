name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: codememory
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: codememory
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U codememory"
          --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun dist/index.js --help
